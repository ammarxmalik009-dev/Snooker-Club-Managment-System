<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070908">
    <title>Customers · Snooker Club Pro</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body data-page="customers">

    <!-- ===== Sidebar (menu items are added by js/core/layout.js) ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a href="/pages/dashboard.html" class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Snooker Club Pro</span>
        </a>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <div class="app-main">
        <!-- ===== Top bar ===== -->
        <header class="topbar">
            <button type="button" class="menu-button" id="menu-button"
                    aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
                <span data-icon="menu"></span>
            </button>
            <h1 class="topbar-title">Customers</h1>

            <div class="topbar-right">
                <span class="topbar-date" id="topbar-date"></span>
                <span class="status-pill" id="server-status" role="status">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="status-text">Checking…</span>
                </span>
            </div>
        </header>

        <!-- ===== Page content ===== -->
        <main class="page-content">
            <div class="page-header">
                <p class="page-intro">People who book tables. Open a customer to see their bookings.</p>
                <button type="button" class="btn btn-primary" id="add-customer-button">
                    <span data-icon="plus"></span> Add Customer
                </button>
            </div>

            <article class="panel panel-wide">
                <header class="panel-header">
                    <h2 class="panel-title">Customer list</h2>
                    <span class="panel-meta" id="customers-summary"></span>
                </header>

                <div class="toolbar toolbar-padded">
                    <div class="search-field">
                        <span data-icon="search"></span>
                        <label for="customer-search" class="visually-hidden">Search customers</label>
                        <input type="search" id="customer-search" class="input" placeholder="Name or phone…" maxlength="50" autocomplete="off">
                    </div>
                    <label class="switch-field inline-switch" for="show-archived">
                        <input type="checkbox" id="show-archived">
                        <span class="switch-text"><strong>Show archived</strong></span>
                    </label>
                </div>

                <div class="list-state list-state-inline" id="customers-loading" role="status">
                    <span class="spinner" aria-hidden="true"></span> Loading customers…
                </div>
                <div class="list-state list-state-inline" id="customers-empty" hidden>
                    <div class="empty-state">
                        <span class="empty-state-icon" data-icon="users"></span>
                        <p class="empty-state-title" id="customers-empty-title">No customers yet</p>
                        <p id="customers-empty-text">Add a customer here, or while making a booking.</p>
                    </div>
                </div>

                <div class="table-scroll" id="customers-wrapper" hidden>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Phone</th>
                                <th scope="col" class="numeric">Bookings</th>
                                <th scope="col">Last booking</th>
                                <th scope="col"><span class="visually-hidden">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody id="customers-body"></tbody>
                    </table>
                </div>

                <nav class="pagination" id="customers-pagination" aria-label="Customer pages" hidden>
                    <button type="button" class="btn btn-secondary btn-small" id="page-prev">Previous</button>
                    <span class="pagination-info" id="page-info"></span>
                    <button type="button" class="btn btn-secondary btn-small" id="page-next">Next</button>
                </nav>
            </article>
        </main>
    </div>

    <!-- ===== Add / Edit customer ===== -->
    <dialog class="modal" id="customer-dialog" aria-labelledby="customer-dialog-title">
        <form class="modal-content" id="customer-form" novalidate>
            <h2 class="modal-title" id="customer-dialog-title">Add customer</h2>
            <p class="form-error" id="customer-form-error" role="alert" hidden></p>
            <div class="form-field">
                <label for="field-name">Name</label>
                <input type="text" id="field-name" name="name" class="input" maxlength="60" autocomplete="off">
                <p class="field-error" data-error-for="name" hidden></p>
            </div>
            <div class="form-field">
                <label for="field-phone">Phone <span class="optional">(optional)</span></label>
                <input type="tel" id="field-phone" name="phone" class="input" maxlength="20" placeholder="0300-1234567" autocomplete="off">
                <p class="field-error" data-error-for="phone" hidden></p>
            </div>
            <div class="form-field">
                <label for="field-notes">Notes <span class="optional">(optional)</span></label>
                <input type="text" id="field-notes" name="notes" class="input" maxlength="200">
                <p class="field-error" data-error-for="notes" hidden></p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="customer-cancel">Cancel</button>
                <button type="submit" class="btn btn-primary" id="customer-save">Save Customer</button>
            </div>
        </form>
    </dialog>

    <!-- ===== Customer profile (filled in by customers.js) ===== -->
    <dialog class="modal modal-wide" id="profile-dialog" aria-labelledby="profile-title">
        <div class="modal-content" id="profile"></div>
    </dialog>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/ui.js"></script>
    <script src="/js/core/format.js"></script>
    <script src="/js/core/layout.js"></script>
    <script src="/js/pages/customers.js"></script>
</body>
</html>
