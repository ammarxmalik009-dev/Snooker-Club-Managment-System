<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070908">
    <title>Bookings · Snooker Club Pro</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body data-page="bookings">

    <!-- ===== Sidebar (menu items are added by js/core/layout.js) ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <a href="/pages/dashboard.html" class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Snooker Club Pro</span>
        </a>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <div class="app-main">
        <!-- ===== Top bar ===== -->
        <header class="topbar">
            <button type="button" class="menu-button" id="menu-button"
                    aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
                <span data-icon="menu"></span>
            </button>
            <h1 class="topbar-title">Bookings</h1>

            <div class="topbar-right">
                <span class="topbar-date" id="topbar-date"></span>
                <span class="status-pill" id="server-status" role="status">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="status-text">Checking…</span>
                </span>
            </div>
        </header>

        <!-- ===== Page content ===== -->
        <main class="page-content">
            <div class="page-header">
                <p class="page-intro">Reserve tables for customers, then check them in when they arrive.</p>
                <button type="button" class="btn btn-primary" id="new-booking-button">
                    <span data-icon="plus"></span> New Booking
                </button>
            </div>

            <!-- ===== Day picker ===== -->
            <div class="date-bar">
                <button type="button" class="btn btn-secondary btn-icon" id="day-prev" aria-label="Previous day"><span data-icon="chevronLeft"></span></button>
                <label class="visually-hidden" for="day-input">Day</label>
                <input type="date" id="day-input" class="input date-input">
                <button type="button" class="btn btn-secondary btn-icon" id="day-next" aria-label="Next day"><span data-icon="chevronRight"></span></button>
                <button type="button" class="btn btn-ghost" id="day-today">Today</button>
                <h2 class="date-bar-title" id="day-title"></h2>
            </div>

            <!-- ===== Day view (timeline) ===== -->
            <article class="panel panel-wide">
                <header class="panel-header">
                    <h2 class="panel-title">Day view</h2>
                    <ul class="legend" aria-label="Booking colours">
                        <li><span class="legend-dot booking-dot-pending"></span>Pending</li>
                        <li><span class="legend-dot booking-dot-confirmed"></span>Confirmed</li>
                        <li><span class="legend-dot booking-dot-completed"></span>Checked in</li>
                        <li><span class="legend-dot booking-dot-no_show"></span>No-show</li>
                    </ul>
                </header>
                <div class="timeline-wrapper" id="timeline">
                    <div class="empty-state panel-empty"><span class="spinner" aria-hidden="true"></span><p>Loading…</p></div>
                </div>
            </article>

            <!-- ===== Bookings list ===== -->
            <article class="panel panel-wide">
                <header class="panel-header">
                    <h2 class="panel-title">Bookings on this day</h2>
                    <span class="panel-meta" id="bookings-summary"></span>
                </header>

                <div class="toolbar toolbar-padded">
                    <div class="filter-chips" id="status-filter" role="group" aria-label="Filter by status">
                        <button type="button" class="chip" data-status="" aria-pressed="true">All</button>
                        <button type="button" class="chip" data-status="active" aria-pressed="false">Upcoming</button>
                        <button type="button" class="chip" data-status="completed" aria-pressed="false">Checked in</button>
                        <button type="button" class="chip" data-status="no_show" aria-pressed="false">No-show</button>
                        <button type="button" class="chip" data-status="cancelled" aria-pressed="false">Cancelled</button>
                    </div>
                    <div class="search-field">
                        <span data-icon="search"></span>
                        <label for="booking-search" class="visually-hidden">Search bookings</label>
                        <input type="search" id="booking-search" class="input" placeholder="Customer, phone or table…" maxlength="50" autocomplete="off">
                    </div>
                </div>

                <div class="panel-body panel-body-list" id="booking-list">
                    <div class="empty-state"><span class="spinner" aria-hidden="true"></span><p>Loading…</p></div>
                </div>
            </article>
        </main>
    </div>

    <!-- ===== New / Edit booking ===== -->
    <dialog class="modal modal-wide" id="booking-dialog" aria-labelledby="booking-dialog-title">
        <form class="modal-content" id="booking-form" novalidate>
            <h2 class="modal-title" id="booking-dialog-title">New booking</h2>
            <p class="modal-subtitle" id="booking-dialog-subtitle">Times are in club time (Karachi).</p>
            <p class="form-error" id="booking-form-error" role="alert" hidden></p>

            <!-- Customer: search an existing one, or add a new one -->
            <fieldset class="bill-section" id="customer-section">
                <legend class="bill-section-title">Customer</legend>
                <div id="customer-picker">
                    <div class="combo">
                        <label for="customer-search" class="visually-hidden">Find customer</label>
                        <input type="search" id="customer-search" class="input" placeholder="Search by name or phone…" autocomplete="off"
                               role="combobox" aria-expanded="false" aria-controls="customer-suggestions" aria-autocomplete="list">
                        <ul class="suggestions" id="customer-suggestions" role="listbox" hidden></ul>
                    </div>
                    <div class="selected-customer" id="selected-customer" hidden>
                        <span data-icon="user"></span>
                        <span class="selected-customer-text" id="selected-customer-text"></span>
                        <button type="button" class="btn btn-ghost btn-small" id="change-customer">Change</button>
                    </div>
                    <button type="button" class="btn btn-ghost btn-small" id="new-customer-toggle"><span data-icon="plus"></span> New customer</button>
                </div>
                <div class="form-row" id="new-customer-fields" hidden>
                    <div class="form-field">
                        <label for="new-customer-name">Name</label>
                        <input type="text" id="new-customer-name" class="input" maxlength="60" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label for="new-customer-phone">Phone <span class="optional">(optional)</span></label>
                        <input type="tel" id="new-customer-phone" class="input" maxlength="20" placeholder="0300-1234567" autocomplete="off">
                    </div>
                </div>
                <p class="field-error" data-error-for="customer" hidden></p>
            </fieldset>

            <div class="form-row">
                <div class="form-field">
                    <label for="booking-table">Table</label>
                    <select id="booking-table" name="tableId" class="select"></select>
                    <p class="field-error" data-error-for="tableId" hidden></p>
                </div>
                <div class="form-field">
                    <label for="booking-date">Date</label>
                    <input type="date" id="booking-date" name="date" class="input">
                    <p class="field-error" data-error-for="date" hidden></p>
                </div>
                <div class="form-field">
                    <label for="booking-start">Start time</label>
                    <select id="booking-start" name="startTime" class="select"></select>
                    <p class="field-error" data-error-for="startTime" hidden></p>
                </div>
                <div class="form-field">
                    <label for="booking-duration">Duration</label>
                    <select id="booking-duration" name="durationMinutes" class="select"></select>
                    <p class="field-error" data-error-for="durationMinutes" hidden></p>
                </div>
            </div>

            <div class="form-field">
                <label for="booking-notes">Notes <span class="optional">(optional)</span></label>
                <input type="text" id="booking-notes" name="notes" class="input" maxlength="200" placeholder="e.g. Birthday, 4 players">
            </div>

            <label class="switch-field" for="booking-confirmed" id="confirmed-field">
                <input type="checkbox" id="booking-confirmed">
                <span class="switch-text"><strong>Already confirmed</strong><span class="field-hint">Tick if the customer confirmed on the phone.</span></span>
            </label>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="booking-cancel">Close</button>
                <button type="submit" class="btn btn-primary" id="booking-save">Save Booking</button>
            </div>
        </form>
    </dialog>

    <script src="/js/core/api.js"></script>
    <script src="/js/core/ui.js"></script>
    <script src="/js/core/format.js"></script>
    <script src="/js/core/sessions.js"></script>
    <script src="/js/core/cafe.js"></script>
    <script src="/js/core/layout.js"></script>
    <script src="/js/pages/bookings.js"></script>
</body>
</html>
